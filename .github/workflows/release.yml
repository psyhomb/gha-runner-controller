name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # semver releases (v1.2.3)
      - "v[0-9]+.[0-9]+.[0-9]+-*" # semver prereleases (v1.2.3-rc.1)

permissions:
  contents: write # for gh release create

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # Go version pinned by go.mod

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Check (gofmt + vet)
        run: task check

      - name: Test
        run: task test

      - name: Build
        run: task build VERSION="${GITHUB_REF_NAME#v}" # v1.0.0 -> 1.0.0
        env:
          GOOS: darwin # deployment target: macOS (Apple Silicon)
          GOARCH: arm64

      - name: Package binary
        run: mv gha-runner-controller gha-runner-controller-darwin-arm64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            gha-runner-controller-darwin-arm64 \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $(case "${{ github.ref_name }}" in *-*) echo --prerelease ;; esac)
